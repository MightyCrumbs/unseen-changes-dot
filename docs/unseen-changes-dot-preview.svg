<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Unseen Changes Dot markers in an Obsidian-style file explorer</title>
  <desc id="desc">A light blue dot marks a new note and a purple dot marks a changed note.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24242a"/>
      <stop offset="1" stop-color="#19191d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="26" fill="#f3f0f8"/>
  <rect x="86" y="48" width="748" height="324" rx="18" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="86" y="48" width="290" height="324" rx="18" fill="#2c2c33"/>
  <path d="M358 48h18v324h-18z" fill="#2c2c33"/>
  <path d="M376 48v324" stroke="#3b3b44"/>

  <circle cx="112" cy="76" r="6" fill="#ff5f57"/>
  <circle cx="132" cy="76" r="6" fill="#febc2e"/>
  <circle cx="152" cy="76" r="6" fill="#28c840"/>

  <text x="116" y="126" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650">Example vault</text>
  <text x="116" y="164" fill="#a9a9b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">⌄  Projects</text>

  <circle cx="142" cy="201" r="5" fill="#74b3f5"/>
  <text x="160" y="207" fill="#efeff1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">New note</text>

  <circle cx="142" cy="246" r="5" fill="#9b7cff"/>
  <text x="160" y="252" fill="#efeff1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Changed note</text>

  <text x="116" y="300" fill="#a9a9b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">›  Archive</text>
  <text x="116" y="337" fill="#a9a9b2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">›  Resources</text>

  <text x="430" y="126" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">See what changed</text>
  <text x="430" y="163" fill="#b8b8c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Blue marks a new file.</text>
  <text x="430" y="193" fill="#b8b8c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Purple marks a changed file.</text>

  <rect x="430" y="238" width="322" height="74" rx="12" fill="#303039" stroke="#44444f"/>
  <circle cx="462" cy="275" r="7" fill="#74b3f5"/>
  <circle cx="492" cy="275" r="7" fill="#9b7cff"/>
  <text x="520" y="281" fill="#e7e7ea" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Both states can roll up to a folder</text>
</svg>
